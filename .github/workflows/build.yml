name: Build binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check internal/webapp/static/app.js

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          name="stremio-trakt-export-${GOOS}-${GOARCH}"
          mkdir -p dist
          if [[ "${GOOS}" == "windows" ]]; then
            go build -trimpath -ldflags="-s -w" -o "dist/${name}.exe" .
          else
            go build -trimpath -ldflags="-s -w" -o "dist/${name}" .
          fi
      - name: Package binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          name="stremio-trakt-export-${GOOS}-${GOARCH}"
          if [[ "${GOOS}" == "windows" ]]; then
            zip -j "${name}.zip" "${name}.exe"
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            tar -czf "${name}.tar.gz" "${name}"
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stremio-trakt-export-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Attach binaries to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release/* --clobber
          else
            gh release create "${TAG_NAME}" release/* --generate-notes
          fi
